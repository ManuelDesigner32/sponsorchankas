<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Múltiple - Sponsors Los Chankas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            color: #8c1c13;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 800px; /* Más ancho para que entren las miniaturas */
            width: 100%;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #8c1c13;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
            width: 100%;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #6a150f;
        }
        .btn-upload {
            background-color: #333;
        }
        .btn-upload:hover {
            background-color: #555;
        }
        /* Estilos para la galería de fotos generadas */
        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .canvas-wrapper {
            width: 150px;
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .canvas-wrapper canvas {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sponsors Los Chankas</h1>
        <p>Sube varias fotos a la vez para aplicarles el cintillo.</p>
        
        <!-- Ahora el input tiene la propiedad "multiple" -->
        <label class="btn btn-upload">
            Seleccionar Múltiples Fotos
            <input type="file" id="upload" accept="image/png, image/jpeg, image/jpg" multiple>
        </label>
        
        <button id="downloadBtn" class="btn" style="display: none;">Descargar Todas (Individualmente)</button>
        
        <!-- Aquí aparecerán las miniaturas de todas las fotos procesadas -->
        <div id="previewContainer"></div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        const templateSrc = 'plantilla-sponsor-vertical.png';
        let templateImage = new Image();
        templateImage.src = templateSrc;

        // Array para guardar todas las fotos generadas
        let generatedCanvases = [];

        upload.addEventListener('change', function(e) {
            // Limpiar todo si el usuario sube un nuevo lote de fotos
            previewContainer.innerHTML = '';
            generatedCanvases = [];
            const files = e.target.files;

            if (files.length > 0) {
                downloadBtn.style.display = 'block';
            } else {
                downloadBtn.style.display = 'none';
            }

            // Procesar cada archivo seleccionado
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    let uploadedImage = new Image();
                    uploadedImage.onload = function() {
                        generarImagen(uploadedImage, file.name);
                    }
                    uploadedImage.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
        });

            const ctx = canvas.getContext('2d');
